<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0c29"/>
      <stop offset="50%" style="stop-color:#302b63"/>
      <stop offset="100%" style="stop-color:#24243e"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00f0ff"/>
      <stop offset="100%" style="stop-color:#b026ff"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="12" fill="url(#bg)"/>
  <!-- Battery/Cell shape -->
  <rect x="12" y="18" width="16" height="28" rx="3" fill="none" stroke="#00f0ff" stroke-width="2" opacity="0.8"/>
  <rect x="36" y="18" width="16" height="28" rx="3" fill="none" stroke="#b026ff" stroke-width="2" opacity="0.8"/>
  <!-- Bridge -->
  <path d="M28 28 Q32 22 36 28" fill="none" stroke="#ffd700" stroke-width="2" stroke-linecap="round"/>
  <!-- Wire top -->
  <path d="M20 18 L20 12 L44 12 L44 18" fill="none" stroke="url(#bolt)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Lightning bolt -->
  <polygon points="30,8 34,8 32,12 35,12 29,20 31,14 28,14" fill="#ffd700"/>
  <!-- Electrodes -->
  <rect x="18" y="24" width="4" height="18" rx="1" fill="#00f0ff" opacity="0.6"/>
  <rect x="42" y="24" width="4" height="18" rx="1" fill="#b026ff" opacity="0.6"/>
  <!-- Bubbles -->
  <circle cx="16" cy="38" r="1.5" fill="#00f0ff" opacity="0.4"/>
  <circle cx="22" cy="34" r="1" fill="#00f0ff" opacity="0.3"/>
  <circle cx="40" cy="36" r="1.5" fill="#b026ff" opacity="0.4"/>
  <circle cx="48" cy="32" r="1" fill="#b026ff" opacity="0.3"/>
  <!-- Labels -->
  <text x="20" y="54" text-anchor="middle" fill="#00f0ff" font-size="7" font-weight="bold" font-family="sans-serif">−</text>
  <text x="44" y="54" text-anchor="middle" fill="#b026ff" font-size="7" font-weight="bold" font-family="sans-serif">+</text>
</svg>
